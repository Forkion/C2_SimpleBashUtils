name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Code style check
      run: |
        cd src/cat && make clang_n || exit 1
        cd ../grep && make clang_n || exit 1

    - name: Build cat
      run: |
        cd src/cat
        mkdir -p build
        make
        cp s21_cat build/s21_cat

    - name: Build grep
      run: |
        cd src/grep
        mkdir -p build
        make
        cp s21_grep build/s21_grep

    - name: Test cat
      run: |
        cd src/cat
        make test || exit 1

    - name: Test grep
      run: |
        cd src/grep
        make test || exit 1

    - name: Telegram notification
      if: always()
      run: |
          pwd
          source /home/leonmari/.telegram_vars
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="CI Pipeline - Status: ${{ job.status }}"
